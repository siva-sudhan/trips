function outfitHTML(d){
  if(!d.outfit || !d.outfit.length) return '';
  return `<div class="outfit"><h3 style="margin-bottom:8px">What to wear</h3>${d.outfit.map(([who,what])=>`<div class="ofit"><span class="who-av">${esc(who.slice(0,1))}</span><div><b>${esc(who)}</b><p class="small">${esc(what)}</p></div></div>`).join('')}</div>`;
}
/* ---------- WALLET ---------- */
function forexHTML(){
  const fx = D.places.map((p,i)=>({...p,i})).filter(p=>p.c==='forex'); if(!fx.length) return '';
  const order = Object.keys(CITY);
  const today = todayISO(), curDay = D.days.find(d=>d.date===today);
  const curCity = curDay ? (D.cityKeys||{})[curDay.city] : null;
  const groups = order.map(c=>[c, fx.filter(p=>p.city===c)]).filter(([,a])=>a.length);
  if(curCity) groups.sort((a,b)=>(b[0]===curCity)-(a[0]===curCity));
  return `<div class="block"><div class="vh" style="padding:0 0 6px"><h3>Where to exchange</h3><a class="chip" href="#map" id="fxMap"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.3 6 20.6l1.3-6.7-5-4.7 6.8-.8z" fill="#d7263d"/></svg>Red stars on the map</a></div>
    <p class="small muted" style="margin-bottom:10px">Well-reviewed gold shops and banks near our stops, picked from several travel guides.${curCity?' Today\'s city is first.':''}</p>
    ${groups.map(([c,arr])=>`<h4 style="margin:14px 0 6px;font-size:.95rem">${esc(CITY[c])}</h4><div class="finds">${arr.map(p=>findRow(p.n,'',p.note,p.i,null)).join('')}</div>`).join('')}
    ${(D.forexTips||[]).length?`<div class="panel" style="margin-top:12px;display:grid;gap:6px">${D.forexTips.map(t=>`<p class="tip">${esc(t)}</p>`).join('')}</div>`:''}
  </div>`;
}
const CATS = ['Food','Transport','Shopping','Tickets','Cafe','Stay extras','Tips','Other'];
let W = null;
const WL = () => D.trip.wallet;
let txMode='spend';
function saveW(){ LS.set('wallet', W); scheduleSync(); }
const fmtUSD = n => WL().carrySym + (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtVND = n => Math.round(n).toLocaleString('en-US') + ' ' + WL().localSym;
const fmtINR = n => WL().homeSym + Math.round(n).toLocaleString('en-IN');
function balances(){
  let usd=0, vnd=0, spentUSD=0; const byCat={};
  W.txns.forEach(t=>{
    if(t.type==='add') usd += t.usd;
    if(t.type==='exchange'){ usd -= t.usd; vnd += t.vnd; }
    if(t.type==='spend'){ const inUSD = t.cur===WL().carry ? t.amt : t.amt / W.rate.vnd; if(t.cur===WL().carry) usd -= t.amt; else vnd -= t.amt; spentUSD += inUSD; byCat[t.cat]=(byCat[t.cat]||0)+inUSD; }
  });
  return {usd, vnd, spentUSD, byCat, totalUSD: usd + vnd / W.rate.vnd};
}
async function fetchRate(){
  try{
    const r = await fetch('https://open.er-api.com/v6/latest/'+WL().carry, {cache:'no-store'});
    const j = await r.json();
    if(j && j.rates && j.rates[WL().local]){ W.rate = {vnd:j.rates[WL().local], inr:j.rates[WL().home], at:Date.now(), live:true}; saveW(); drawWallet(); }
  }catch(e){ /* offline: keep last saved rate */ }
}
function renderWallet(){
  W = LS.get('wallet', {txns:[], rate:{vnd:WL().fallbackRate, inr:WL().fallbackHome, at:null, live:false}});
  $('#view-wallet').innerHTML = `<div class="vh"><h2>Wallet</h2></div><div id="walletBody"></div>`;
  drawWallet(); fetchRate();
}
function ago(ts){ if(!ts) return 'not yet updated'; const m=Math.round((Date.now()-ts)/60000); if(m<1) return 'just now'; if(m<60) return m+' min ago'; const h=Math.round(m/60); if(h<48) return h+' h ago'; return Math.round(h/24)+' days ago'; }
function drawWallet(){
  const b = balances(), el=$('#walletBody'); if(!el) return;
  const maxCat = Math.max(1, ...Object.values(b.byCat));
  const recent = [...W.txns].sort((a,c)=>c.ts-a.ts);
  el.innerHTML = `
  <div id="syncPanel" style="margin-bottom:12px"></div>
  <div class="balances">
    <div class="bal big"><div class="k">Cash left, all in ${WL().carry}</div><div class="v">${fmtUSD(b.totalUSD)}</div><div class="s">${fmtINR(b.totalUSD*W.rate.inr)} at today's rate</div></div>
    <div class="bal"><div class="k">${esc(WL().carryName)} in hand</div><div class="v">${fmtUSD(b.usd)}</div></div>
    <div class="bal"><div class="k">${esc(WL().localName)} in hand</div><div class="v">${Math.round(b.vnd/1000).toLocaleString('en-US')}k ${WL().localSym}</div><div class="s">${fmtUSD(b.vnd/W.rate.vnd)}</div></div>
    <div class="bal" style="grid-column:1/-1"><div class="k">Spent so far</div><div class="v">${fmtUSD(b.spentUSD)} <span class="small muted" style="font-family:var(--body);font-weight:500">${fmtINR(b.spentUSD*W.rate.inr)}</span></div></div>
  </div>

  <div class="block"><div class="panel">
    <div class="rate"><div><div class="small muted">1 ${WL().carry}</div><div class="v">${Math.round(W.rate.vnd).toLocaleString('en-US')} ${WL().localSym}</div></div>
    <div class="small muted" style="text-align:right">${W.rate.live?'Live rate':'Saved rate'}, ${ago(W.rate.at)}<br><button class="btn sm ghost" id="refreshRate" style="margin-top:6px">Refresh</button></div></div>
    <div class="conv">
      <div class="field"><label for="cvUSD">${WL().carry}</label><input id="cvUSD" inputmode="decimal" placeholder="10"></div>
      <div class="field"><label for="cvVND">${esc(WL().localName)}</label><input id="cvVND" inputmode="numeric" placeholder="263,000"></div>
    </div>
    <p class="small muted" style="margin-top:8px" id="cvINR">Type in either box to convert. Exchange shops pay a little less than this mid-market rate.</p>
  </div></div>

  <div class="block"><div class="panel">
    <div class="seg" role="group" aria-label="Entry type">
      <button data-m="spend" aria-pressed="${txMode==='spend'}">Spend</button>
      <button data-m="exchange" aria-pressed="${txMode==='exchange'}">Exchange</button>
      <button data-m="add" aria-pressed="${txMode==='add'}">Add cash</button>
    </div>
    <form class="form" id="txForm">${txFormHTML()}</form>
  </div></div>

  ${b.spentUSD>0?`<div class="block"><h3>Where it went</h3><div class="panel bars">${Object.entries(b.byCat).sort((a,c)=>c[1]-a[1]).map(([k,v])=>`<div class="bar"><span>${esc(k)}</span><div class="track"><div class="fill" style="width:${(v/maxCat*100).toFixed(1)}%"></div></div><span class="small">${fmtUSD(v)}</span></div>`).join('')}</div></div>`:''}

  ${forexHTML()}
  <div class="block"><div class="vh" style="padding:0 0 10px"><h3>History</h3>${W.txns.length?'<button class="btn sm ghost" id="csvBtn">Export CSV</button>':''}</div>
    <div class="panel">${recent.length?`<ul class="txns">${recent.map(txRow).join('')}</ul>`:'<div class="empty">Start by adding the dollars you are carrying, then log each exchange and spend.</div>'}</div>
  </div>`;
  $$('.seg button', el).forEach(btn=>btn.onclick=()=>{ txMode=btn.dataset.m; drawWallet(); });
  $('#refreshRate').onclick = () => { toast('Checking the latest rate…'); fetchRate(); };
  const u=$('#cvUSD'), d=$('#cvVND'), inr=$('#cvINR');
  const num = s => parseFloat(String(s).replace(/,/g,''))||0;
  u.oninput = () => { const x=num(u.value); d.value = x? Math.round(x*W.rate.vnd).toLocaleString('en-US') : ''; inr.textContent = x? `${fmtUSD(x)} is about ${fmtINR(x*W.rate.inr)}` : ''; };
  d.oninput = () => { const x=num(d.value); u.value = x? (x/W.rate.vnd).toFixed(2) : ''; inr.textContent = x? `${fmtVND(x)} is about ${fmtINR(x/W.rate.vnd*W.rate.inr)}` : ''; };
  wireTxForm(); paintSync();
  $$('[data-fly]', el).forEach(b=>b.onclick=()=>flyTo(+b.dataset.fly));
  $$('.txns button', el).forEach(btn=>btn.onclick=()=>{ if(confirm('Delete this entry?')){ W.txns = W.txns.filter(t=>t.id!==btn.dataset.id); W.del=(W.del||[]).concat(btn.dataset.id); saveW(); drawWallet(); } });
  const csv=$('#csvBtn'); if(csv) csv.onclick = () => download(D.trip.slug+'-wallet.csv', 'date,type,category,amount,currency,usd,vnd,note\n' + W.txns.map(t=>[t.date,t.type,t.cat||'',t.amt??'',t.cur||'',t.usd??'',t.vnd??'',`"${(t.note||'').replace(/"/g,'""')}"`].join(',')).join('\n'), 'text/csv');
}
function txFormHTML(){
  const today = todayISO();
  if(txMode==='add') return `<div class="field"><label for="fUSD">${esc(WL().carryName)} you are carrying</label><input id="fUSD" inputmode="decimal" required placeholder="500"></div>
    <div class="field"><label for="fNote">Note</label><input id="fNote" placeholder="Cash from India"></div><button class="btn full" type="submit">Add cash</button>`;
  if(txMode==='exchange') return `<div class="two"><div class="field"><label for="fUSD">${WL().carry} given</label><input id="fUSD" inputmode="decimal" required placeholder="100"></div>
    <div class="field"><label for="fVND">${esc(WL().localName)} received</label><input id="fVND" inputmode="numeric" required placeholder="${Math.round(100*W.rate.vnd).toLocaleString('en-US')}"></div></div>
    <p class="small muted" id="fRate">Shop rate shows here as you type</p>
    <div class="field"><label for="fNote">Where</label><input id="fNote" placeholder="Gold shop, Ha Trung street"></div><button class="btn full" type="submit">Log exchange</button>`;
  return `<div class="two"><div class="field"><label for="fAmt">Amount</label><input id="fAmt" inputmode="decimal" required placeholder="85000"></div>
    <div class="field"><label for="fCur">Currency</label><select id="fCur"><option>${WL().local}</option><option>${WL().carry}</option></select></div></div>
    <div class="two"><div class="field"><label for="fCat">Category</label><select id="fCat">${CATS.map(c=>`<option>${c}</option>`).join('')}</select></div>
    <div class="field"><label for="fDate">Date</label><input id="fDate" type="date" value="${today}"></div></div>
    <div class="field"><label for="fNote">What for</label><input id="fNote" placeholder="Bun cha for two"></div><button class="btn full" type="submit">Log spend</button>`;
}
function wireTxForm(){
  const f=$('#txForm'); const num = s => parseFloat(String(s||'').replace(/,/g,''))||0;
  if(txMode==='exchange'){ const u=$('#fUSD'), v=$('#fVND'); const upd=()=>{ const a=num(u.value), c=num(v.value); $('#fRate').textContent = a&&c ? `Shop rate ${Math.round(c/a).toLocaleString('en-US')} ${WL().localSym} per ${WL().carry} (market ${Math.round(W.rate.vnd).toLocaleString('en-US')})` : 'Shop rate shows here as you type'; }; u.oninput=()=>{ if(!v.dataset.touched) v.value = num(u.value)? Math.round(num(u.value)*W.rate.vnd).toLocaleString('en-US'):''; upd(); }; v.oninput=()=>{ v.dataset.touched=1; upd(); }; }
  f.onsubmit = e => {
    e.preventDefault(); const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts=Date.now(), note=($('#fNote')||{}).value||'';
    if(txMode==='add'){ const usd=num($('#fUSD').value); if(!usd) return; W.txns.push({id,ts,type:'add',usd,note,date:todayISO()}); toast(`Added ${fmtUSD(usd)}`); }
    else if(txMode==='exchange'){ const usd=num($('#fUSD').value), vnd=num($('#fVND').value); if(!usd||!vnd) return; W.txns.push({id,ts,type:'exchange',usd,vnd,note,date:todayISO()}); toast(`Exchanged ${fmtUSD(usd)} for ${fmtVND(vnd)}`); }
    else { const amt=num($('#fAmt').value); if(!amt) return; W.txns.push({id,ts,type:'spend',amt,cur:$('#fCur').value,cat:$('#fCat').value,note,date:$('#fDate').value||todayISO()}); toast('Spend logged'); }
    saveW(); drawWallet();
  };
}
function txRow(t){
  let label, amt, cls='';
  if(t.type==='add'){ label='Added cash'; amt='+'+fmtUSD(t.usd); cls='in'; }
  else if(t.type==='exchange'){ label=`Exchanged ${fmtUSD(t.usd)}`; amt='+'+fmtVND(t.vnd); cls='in'; }
  else { label=t.cat; amt='−'+(t.cur===WL().carry?fmtUSD(t.amt):fmtVND(t.amt)); }
  return `<li><div><div>${esc(label)}${t.note?`<span class="muted">, ${esc(t.note)}</span>`:''}</div><div class="small muted">${fmtDate(t.date,{day:'numeric',month:'short'})}</div></div><div class="amt ${cls}">${amt}</div><button aria-label="Delete entry" data-id="${t.id}">${ICON.x.replace('<svg','<svg width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:2"')}</button></li>`;
}

/* ---------- PACK ---------- */
function renderPack(){
  const P=D.pack, chk=LS.get('pack',{});
  const list = (key, items) => {
    const label = x => typeof x === 'string' ? x : x.t, isB = x => typeof x === 'object' && x.bought;
    const done = items.filter((x,i)=>chk[key+i] || isB(x)).length;
    return `<div class="panel"><div class="small muted">${done} of ${items.length} ready</div><div class="progress"><div style="width:${done/items.length*100}%"></div></div>
      <div class="check">${items.map((x,i)=>`<label><input type="checkbox" data-k="${key+i}" ${chk[key+i]?'checked':''}><span>${esc(label(x))}${isB(x)?' <span class="tag">Bought</span>':''}</span></label>`).join('')}</div></div>`;
  };
  const ins=D.docs.insurance;
  $('#view-pack').innerHTML = `<div class="vh"><h2>Pack and prepare</h2></div>
  <div class="block"><h3>Before you fly</h3><div class="panel" style="display:grid;gap:10px">${D.docs.entry.map(x=>`<p class="tip">${esc(x)}</p>`).join('')}
    ${D.docs.entryLink?`<a class="btn sm" href="${esc(D.docs.entryLink.url)}" target="_blank" rel="noopener" style="justify-self:start">${esc(D.docs.entryLink.label)}</a>`:''}</div></div>

  ${D.sim?`<div class="block" id="sim"><h3>Phone and SIM</h3><div class="panel sim">
    <p style="margin-bottom:10px">${esc(D.sim.summary)}</p>
    <b class="small">Bring to the counter</b><ul class="small" style="margin:4px 0 12px;padding-left:18px">${D.sim.bring.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
    <b class="small">Step by step</b><ol class="simsteps">${D.sim.steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <div style="display:grid;gap:6px;margin-top:10px">${D.sim.tips.map(x=>`<p class="tip">${esc(x)}</p>`).join('')}</div>
  </div></div>`:''}
  <div class="block"><h3>Weather to expect</h3><p class="small muted" style="margin-bottom:8px">Typical November ranges. Check a forecast a few days out.</p>
    <div class="wx">${D.weather.map(w=>`<div class="row"><div><b>${esc(w.city)}</b><div class="small muted">${esc(w.dates)}</div></div><div class="t">${esc(w.temp)}</div><div class="note">${esc(w.note)}</div></div>`).join('')}</div></div>

  <div class="block"><h3>Luggage limits, per person</h3>
    <div class="panel">${(D.luggage||[]).map(([a,b,kg,strict])=>`<div class="bag"><span>${esc(a)}</span><span class="small muted">${esc(b)}</span><span class="kg ${strict?'strict':''}">${esc(kg)}</span></div>`).join('')}
      ${D.luggageNote?`<p class="small muted" style="margin-top:8px">${esc(D.luggageNote)}</p>`:''}
    </div></div>

  <div class="block"><h3>Pack from home, or buy there</h3><div class="split">
    <div class="panel"><b>Bring from India</b><ul>${D.buy.home.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>
    <div class="panel"><b>Buy in ${esc(D.trip.country)}</b><ul>${D.buy.there.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><a class="chip" href="#finds" style="margin-top:10px" id="toShopPlan">See when we shop</a></div>
  </div></div>
  ${P.tobuy && P.tobuy.length ? `<div class="block"><h3>Still to buy before 11 Nov</h3>${list('b',P.tobuy)}</div>`:''}
  <div class="block"><h3>Shiva's clothes</h3>${list('s',P.shiva)}</div>
  <div class="block"><h3>Meena's clothes</h3>${list('m',P.meena)}</div>
  <div class="block"><h3>Shared</h3>${list('x',P.shared)}</div>
  <div class="block"><h3>Gear</h3>${list('g',P.gear)}</div>
  <div class="block"><h3>Health</h3>${list('h',P.health)}</div>
  <div class="block"><h3>Documents and money</h3>${list('d',P.docs)}</div>

  <div class="block"><h3>Insurance</h3><div class="panel">
    <p><b>${esc(ins.provider)}</b>, ${esc(ins.plan)}</p>
    <p class="small muted" style="margin:6px 0">${ins.certs.map(esc).join('<br>')}</p>
    <div class="call"><span>Emergency assistance</span><a href="tel:${ins.assist.replace(/\s/g,'')}">${esc(ins.assist)}</a></div>
    <div class="call"><span>Claims (India toll-free)</span><a href="tel:${ins.claims.replace(/\s/g,'')}">${esc(ins.claims)}</a></div>
  </div></div>

  <div class="block"><h3>Emergency numbers</h3><div class="panel">${D.docs.emergency.map(([k,n])=>`<div class="call"><span>${esc(k)}</span><a href="tel:${n.replace(/\s/g,'')}">${esc(n)}</a></div>`).join('')}</div></div>
  <div class="block"><h3>Appearance</h3><div class="seg" role="group" aria-label="Theme"><button data-th="auto">System</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div></div>`;
  $$('#view-pack .check input').forEach(c=>c.addEventListener('change',()=>{ setMapEntry('pack', c.dataset.k, c.checked); const y=window.scrollY; renderPack(); window.scrollTo(0,y); }));
  const tsp=$('#toShopPlan'); if(tsp) tsp.onclick=()=>{ findTab='shop'; renderFinds(); };
  const th = LS.get('theme','auto');
  $$('[data-th]').forEach(b=>{ b.setAttribute('aria-pressed', b.dataset.th===th); b.onclick=()=>{ LS.set('theme',b.dataset.th); applyTheme(); renderPack(); }; });
}
function applyTheme(){ const th=LS.get('theme','auto'); if(th==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); }
applyTheme();
</script>
</body>
</html>
