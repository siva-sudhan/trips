<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10222b">
<meta name="robots" content="noindex, nofollow">
<title>Our trips</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
:root{
  --ink:#10222b; --ink-2:#2c4450; --jade:#1d7a6c; --jade-soft:#d5ebe5;
  --lantern:#f2b134; --lotus:#e06a8c; --river:#3e7cb1; --mist:#eef3f1;
  --bg:#f4f7f5; --surface:#ffffff; --line:#d9e3df; --text:#10222b; --muted:#5b6f77;
  --shadow:0 1px 2px rgba(16,34,43,.06),0 8px 24px rgba(16,34,43,.06);
  --r-sm:8px; --r-md:14px; --r-lg:24px;
  --nav-h:64px;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Be Vietnam Pro", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c181e; --surface:#13242c; --line:#22363f; --text:#e8f0ed; --muted:#93a8ae;
    --jade-soft:#173a35; --mist:#132a2a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0c181e; --surface:#13242c; --line:#22363f; --text:#e8f0ed; --muted:#93a8ae;
  --jade-soft:#173a35; --mist:#132a2a; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--ink)}
h1,h2,h3{font-family:var(--display);line-height:1.1;margin:0;letter-spacing:-.01em}
h2{font-size:1.6rem;font-weight:800}
h3{font-size:1.08rem;font-weight:600;font-family:var(--body);letter-spacing:0}
p{margin:0}
a{color:var(--jade)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lantern);outline-offset:2px;border-radius:6px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.hidden{display:none!important}

/* ---------- lock ---------- */
#lock{position:fixed;inset:0;display:grid;place-items:center;background:var(--ink);color:#e8f0ed;padding:24px;z-index:100}
#lock .box{width:min(360px,100%)}
#lock h1{font-size:3rem;font-weight:800;line-height:.95;margin-bottom:10px;color:#fff}
#lock h1 span{display:block;color:var(--lantern)}
#lock p{color:#a8bec4;margin-bottom:28px}
#lock label{display:block;font-size:.85rem;color:#a8bec4;margin-bottom:6px}
#lock input[type=password]{width:100%;padding:14px 16px;border-radius:var(--r-md);border:1px solid #2c4450;background:#0b1a21;color:#fff;font-size:1.1rem}
#lock .row{display:flex;align-items:center;gap:8px;margin:14px 0 20px;font-size:.9rem;color:#a8bec4}
#lock .err{color:#ff9fb6;min-height:1.4em;margin-top:10px;font-size:.9rem}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer;background:var(--jade);color:#fff;text-decoration:none;transition:transform .15s ease,background .15s}
.btn:active{transform:scale(.97)}
.btn.full{width:100%}
.btn.gold{background:var(--lantern);color:var(--ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:8px 14px;font-size:.88rem}

/* ---------- shell ---------- */
#app{min-height:100vh;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 16px)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:var(--nav-h);text-decoration:none;color:var(--muted);font-size:.72rem;font-weight:500}
nav.tabs a svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs a[aria-current="page"]{color:var(--jade)}
nav.tabs a[aria-current="page"] svg{stroke-width:2.3}
main{max-width:760px;margin:0 auto;padding:0 16px}
section.view{display:none;animation:viewIn .28s ease both}
section.view.on{display:block}
@keyframes viewIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.vh{padding:22px 0 12px;display:flex;align-items:end;justify-content:space-between;gap:12px}
.block{margin:22px 0}
.block > h3{margin-bottom:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:16px}

@media (min-width:960px){
  #app{padding-bottom:24px;padding-left:96px}
  nav.tabs{top:0;bottom:0;right:auto;width:96px;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
  nav.tabs a{flex:0 0 auto;height:76px}
  main{padding:0 32px}
}

/* ---------- hero ---------- */
.hero{margin:0 -16px;background:var(--ink);color:#e8f0ed;padding:22px 20px 26px;position:relative;overflow:hidden;border-radius:0 0 var(--r-lg) var(--r-lg)}
@media (min-width:960px){.hero{margin:0;border-radius:0 0 var(--r-lg) var(--r-lg)}}
.hero .top{display:flex;justify-content:space-between;align-items:start;gap:16px}
.hero .who{font-size:.9rem;color:#a8bec4}
.hero h1{font-size:clamp(2.6rem,11vw,4.4rem);font-weight:800;line-height:.92;color:#fff;margin:6px 0 10px}
.hero .status{font-size:1.05rem;color:var(--lantern);font-weight:600}
.hero .route{display:block;width:100%;height:auto;max-height:300px;margin:8px auto 0}
@media (min-width:600px){.hero .route{max-height:380px}}
.route .coast{fill:none;stroke:#2c4450;stroke-width:1.2}
.route .path{fill:none;stroke:var(--lantern);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.6s cubic-bezier(.6,.05,.3,1) .2s forwards}
.route .dot{fill:#10222b;stroke:#e8f0ed;stroke-width:1.6;opacity:0;animation:pop .35s ease forwards}
.route .dot.here{fill:var(--lantern);stroke:var(--lantern)}
.route .glow{fill:var(--lantern);opacity:.25;transform-origin:center;transform-box:fill-box;animation:pulse 2.4s ease-in-out infinite 2.8s}
.route text{fill:#cfe0dc;font:500 11px var(--body);opacity:0;animation:pop .4s ease forwards}
.route text.here{fill:var(--lantern);font-weight:600}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{to{opacity:1}}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.25}50%{transform:scale(2.2);opacity:0}}
.hero-grid{display:grid;grid-template-columns:1fr;gap:4px}
@media (min-width:600px){.hero-grid{grid-template-columns:1fr 1fr;align-items:center}}

/* ---------- today ---------- */
.today{margin-top:18px}
.today .panel{border-left:4px solid var(--lantern)}
.today .label{font-size:.85rem;color:var(--muted);margin-bottom:4px}
.today h2{font-size:1.4rem;margin-bottom:10px}
.plan{list-style:none;margin:0;padding:0}
.plan li{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:7px 0;border-top:1px dashed var(--line)}
.plan li:first-child{border-top:0}
.plan time{font-variant-numeric:tabular-nums;font-weight:600;color:var(--jade)}

/* ---------- days timeline ---------- */
.days{position:relative;padding-left:22px}
.days::before{content:"";position:absolute;left:7px;top:8px;bottom:8px;width:2px;background:var(--line)}
.day{position:relative;margin-bottom:10px}
.day::before{content:"";position:absolute;left:-20px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--jade)}
.day.past::before{background:var(--jade)}
.day.now::before{background:var(--lantern);border-color:var(--lantern);box-shadow:0 0 0 5px color-mix(in srgb,var(--lantern) 30%,transparent)}
.day details{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.day summary{list-style:none;cursor:pointer;padding:14px 16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}
.day summary::-webkit-details-marker{display:none}
.day .dn{font-family:var(--display);font-weight:800;font-size:1.5rem;color:var(--jade);min-width:2ch;text-align:center}
.day .dt{font-size:.82rem;color:var(--muted)}
.day .ti{font-weight:600;line-height:1.3}
.day .chev{transition:transform .2s;color:var(--muted)}
.day details[open] .chev{transform:rotate(90deg)}
.day .body{padding:0 16px 16px;display:grid;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:999px;background:var(--mist);border:1px solid var(--line);font-size:.84rem;text-decoration:none;color:var(--text);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
:root[data-theme="dark"] .chip[aria-pressed="true"]{background:var(--lantern);color:var(--ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip[aria-pressed="true"]{background:var(--lantern);color:var(--ink);border-color:var(--lantern)}}
.kv{font-size:.9rem}
.kv b{font-weight:600}
.shot{display:flex;gap:10px;align-items:start;font-size:.92rem}
.shot input{margin-top:4px;accent-color:var(--jade);width:18px;height:18px}
.journal textarea{width:100%;min-height:84px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);padding:10px 12px;resize:vertical}
.tip{font-size:.9rem;padding-left:14px;position:relative}
.tip::before{content:"";position:absolute;left:0;top:.6em;width:6px;height:6px;border-radius:50%;background:var(--lantern)}

/* ---------- hotels & flights ---------- */
.hotels{display:grid;gap:10px}
.hotel{display:grid;grid-template-columns:62px 1fr;gap:14px;align-items:start;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.hotel .nights{background:var(--jade);color:#fff;border-radius:var(--r-sm);text-align:center;padding:8px 4px;line-height:1.1}
.hotel .nights b{display:block;font-family:var(--display);font-size:1.6rem;font-weight:800}
.hotel .nights span{font-size:.72rem}
.hotel h4{margin:0 0 2px;font-size:1rem}
.hotel .links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.flight{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:12px 0;border-top:1px solid var(--line)}
.flight:first-of-type{border-top:0}
.flight .t{font-family:var(--display);font-weight:800;font-size:1.35rem}
.flight .r{text-align:right}
.flight .mid{text-align:center;font-size:.78rem;color:var(--muted)}
.flight .meta{grid-column:1/-1;font-size:.8rem;color:var(--muted)}

/* ---------- map ---------- */
#view-map.on{display:flex;flex-direction:column;height:calc(100vh - var(--nav-h) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px));height:calc(100dvh - var(--nav-h) - env(safe-area-inset-bottom,0px) - env(safe-area-inset-top,0px))}
@media (min-width:960px){#view-map.on{height:calc(100dvh - 24px)}}
.map-tools{padding:12px 0 8px;display:grid;gap:8px}
.scroller{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.scroller::-webkit-scrollbar{display:none}
.scroller .chip{flex:0 0 auto}
#catChips .chip[aria-pressed="true"]{background:var(--surface);color:var(--text);border-color:var(--line)}
#catChips .chip[aria-pressed="false"]{opacity:.45}
#map{flex:1;border-radius:var(--r-md);border:1px solid var(--line);min-height:300px;z-index:1}
.map-actions{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 4px}
.pin{width:18px;height:18px;border-radius:50%;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.pin.stay{width:24px;height:24px;border-radius:7px;background:var(--ink)!important;border-color:var(--lantern)}
.leaflet-popup-content{font:400 14px/1.45 var(--body);margin:12px 14px}
.leaflet-popup-content b{font-size:15px}
.leaflet-popup-content .pl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.leaflet-popup-content .pl a{font-weight:600}
.leaflet-container{background:var(--mist)}
:root[data-theme="dark"] .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .leaflet-tile{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.8rem;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}

/* ---------- finds ---------- */
.finds{display:grid;gap:8px}
.find{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px}
.find .n{font-weight:600;line-height:1.3}
.find .d{font-size:.88rem;color:var(--muted);grid-column:1/-1}
.find .acts{display:flex;gap:6px}
.iconbtn{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);color:var(--text);cursor:pointer;text-decoration:none}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.tag{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:999px;background:var(--jade-soft);color:var(--jade);margin-left:6px;vertical-align:2px;font-weight:600}
.foods{display:flex;flex-wrap:wrap;gap:6px}

/* ---------- wallet ---------- */
.balances{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:14px}
.bal.big{grid-column:1/-1;background:var(--ink);color:#e8f0ed;border:0;position:relative;overflow:hidden}
.bal .k{font-size:.82rem;color:var(--muted)}
.bal.big .k{color:#a8bec4}
.bal .v{font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1.15;font-variant-numeric:tabular-nums;word-break:break-word}
.bal.big .v{font-size:2.3rem;color:#fff}
.bal .s{font-size:.82rem;color:var(--muted);margin-top:2px}
.bal.big .s{color:var(--lantern)}
.rate{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.rate .v{font-family:var(--display);font-weight:800;font-size:1.3rem}
.conv{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.field label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.field input,.field select{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--bg);font-size:1rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--mist);border-radius:999px;padding:4px;gap:4px;border:1px solid var(--line)}
.seg button{border:0;background:transparent;border-radius:999px;padding:9px 6px;font-weight:600;font-size:.9rem;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:var(--shadow)}
.form{display:grid;gap:10px;margin-top:12px}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bars{display:grid;gap:8px}
.bar{display:grid;grid-template-columns:96px 1fr auto;gap:10px;align-items:center;font-size:.88rem}
.bar .track{height:10px;background:var(--mist);border-radius:999px;overflow:hidden}
.bar .fill{height:100%;background:var(--jade);border-radius:999px;transition:width .5s ease}
.txns{list-style:none;margin:0;padding:0}
.txns li{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.txns li:first-child{border-top:0}
.txns .amt{font-variant-numeric:tabular-nums;font-weight:600;text-align:right}
.txns .amt.in{color:var(--jade)}
.txns button{border:0;background:none;color:var(--muted);cursor:pointer;padding:6px}
.empty{padding:18px;text-align:center;color:var(--muted);font-size:.92rem}

/* ---------- shopping plan ---------- */
.splan{list-style:none;margin:0;padding:0 0 0 22px;position:relative}
.splan::before{content:"";position:absolute;left:7px;top:10px;bottom:10px;width:2px;background:var(--line)}
.splan li{position:relative;padding:0 0 16px}
.splan li::before{content:"";position:absolute;left:-20px;top:6px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--lotus)}
.splan li.past::before{background:var(--lotus)}
.splan .when{font-size:.82rem;color:var(--muted)}
.splan .where{font-weight:600;margin:1px 0 4px}
.splan .note{font-size:.86rem;color:var(--muted);margin-top:4px}
.splan .chip{margin-top:8px}
.split{display:grid;gap:10px}
@media (min-width:600px){.split{grid-template-columns:1fr 1fr}}
.split ul{margin:6px 0 0;padding-left:18px;font-size:.92rem}
.split li{margin:4px 0}
/* ---------- pack ---------- */
.wx{display:grid;gap:8px}
.wx .row{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md)}
.wx .t{font-family:var(--display);font-weight:800;color:var(--jade);text-align:right;white-space:nowrap}
.wx .note{grid-column:1/-1;font-size:.86rem;color:var(--muted)}
.check{display:grid;gap:2px}
.check label{display:flex;gap:10px;align-items:start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.check label:first-child{border-top:0}
.check input{width:20px;height:20px;accent-color:var(--jade);flex:0 0 auto;margin-top:1px}
.check input:checked + span{color:var(--muted);text-decoration:line-through}
.progress{height:6px;background:var(--mist);border-radius:999px;overflow:hidden;margin:6px 0 10px}
.progress > div{height:100%;background:var(--lantern);transition:width .3s}
.bag{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:.92rem}
.bag:first-child{border-top:0}
.bag .kg{font-family:var(--display);font-weight:800;font-size:1.2rem;white-space:nowrap}
.bag .kg.strict{color:var(--lotus)}
.call{display:flex;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.call:first-child{border-top:0}
.call a{font-weight:600;text-decoration:none}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:.9rem;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.offline-pill{display:inline-flex;align-items:center;gap:6px;font-size:.78rem;padding:4px 10px;border-radius:999px;background:#2c4450;color:#cfe0dc}
.offline-pill i{width:7px;height:7px;border-radius:50%;background:#7bd389}
.offline-pill.off i{background:var(--lotus)}

/* ---------- hero scene ---------- */
.hero2{position:relative;margin:0 -16px;min-height:min(78vh,620px);display:flex;align-items:flex-end;overflow:hidden;border-radius:0 0 var(--r-lg) var(--r-lg);color:#fff;isolation:isolate}
@media (min-width:960px){
  .hero2{min-height:600px;border-radius:var(--r-lg);margin-top:16px}
  .hero2-in{padding:32px 40px 40px}.hero2 .top{left:40px;right:40px;top:24px}
}
.hero2 .hero-scene{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero2::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(13,28,38,.35) 0%,rgba(13,28,38,0) 30%,rgba(13,28,38,0) 55%,rgba(13,28,38,.85) 100%)}
.hero2-in{width:100%;padding:20px 20px 26px}
.hero2 .top{position:absolute;top:16px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center}
.hero2 .who{font-size:.9rem;color:#e8f0ed;text-shadow:0 1px 6px rgba(0,0,0,.4)}
.hero2 h1{font-size:clamp(3.2rem,15vw,6rem);font-weight:800;line-height:.86;letter-spacing:-.03em;color:#fff;text-shadow:0 4px 30px rgba(0,0,0,.35)}
.hero2 h1 span{display:block;color:var(--lantern)}
.hero2 .status{font-weight:600;font-size:1.05rem;margin-top:10px;color:#fff}
.count{display:flex;gap:8px;margin-top:14px}
.count div{background:rgba(13,28,38,.55);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.14);border-radius:12px;padding:8px 10px;min-width:64px;text-align:center}
.count b{display:block;font-family:var(--display);font-weight:800;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.count span{font-size:.72rem;color:#cfe0dc}
.scene .bird{animation:fly 26s linear infinite;offset-path:none;transform:translate(-60px,220px)}
.scene .b2{animation-duration:32s;animation-delay:-10s}.scene .b3{animation-duration:38s;animation-delay:-20s}
@keyframes fly{0%{transform:translate(-60px,240px)}50%{transform:translate(600px,180px)}100%{transform:translate(1260px,230px)}}
.scene .tw{animation:tw 3.5s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:1}}
.scene .glint{animation:glint 2.6s ease-in-out infinite}
@keyframes glint{0%,100%{opacity:.25;transform:scaleX(.8)}50%{opacity:1;transform:scaleX(1.1)}}
.scene .glint{transform-box:fill-box;transform-origin:center}
.scene .bob{animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(5px) rotate(1.2deg)}}
.scene .rise{animation:rise 14s linear infinite}
@keyframes rise{0%{transform:translate(0,0);opacity:0}8%{opacity:1}50%{transform:translate(18px,-420px)}85%{opacity:.9}100%{transform:translate(-10px,-820px);opacity:0}}
.scene .rip{animation:rip 5s ease-in-out infinite}.scene .r2{animation-delay:-2s}
@keyframes rip{0%,100%{transform:translateX(0);opacity:.2}50%{transform:translateX(30px);opacity:.8}}
.scene .sunp{animation:sunp 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes sunp{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.scene .sway{animation:sway 3.6s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
.scene .win{animation:tw 4s ease-in-out infinite}
.scene .ride{animation:ride 6s linear infinite}
.scene .ride.rev{animation-name:rideRev}
@keyframes ride{from{transform:translateX(-30px)}to{transform:translateX(350px)}}
@keyframes rideRev{from{transform:translateX(350px) scaleX(-1)}to{transform:translateX(-30px) scaleX(-1)}}
.scene .lane{animation:lane 1s linear infinite}
@keyframes lane{to{stroke-dashoffset:-20}}
.scene .swing{animation:swing 3s ease-in-out infinite;transform-origin:0 0}
@keyframes swing{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.scene .refl{animation:tw 3s ease-in-out infinite}
.scene .drift{animation:drift 22s linear infinite}
@keyframes drift{from{transform:translateX(-30px)}to{transform:translateX(350px)}}
.scene .train{animation:train 10s cubic-bezier(.4,0,.6,1) infinite}
@keyframes train{0%,40%{transform:translateX(360px)}85%,100%{transform:translateX(-340px)}}
.scene .steam,.food-svg .steam{animation:steam 2.4s ease-in-out infinite}
.food-svg .s2{animation-delay:-.8s}.food-svg .s3{animation-delay:-1.6s}
@keyframes steam{0%{opacity:0;transform:translateY(4px)}40%{opacity:.8}100%{opacity:0;transform:translateY(-6px)}}
.scene .cloud{animation:cloud 30s linear infinite}.scene .c2{animation-duration:42s;animation-delay:-14s}.scene .c3{animation-duration:36s;animation-delay:-24s}
@keyframes cloud{from{transform:translateX(-120px)}to{transform:translateX(360px)}}
.food-svg .flame{animation:flame .6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:bottom}
@keyframes flame{to{transform:scaleY(1.25)}}

/* ---------- chapters ---------- */
.chapters{display:grid;grid-auto-flow:column;grid-auto-columns:min(78%,320px);gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 16px 14px;margin:0 -16px;scrollbar-width:none}
.chapters::-webkit-scrollbar{display:none}
@media (min-width:960px){.chapters{grid-auto-flow:row;grid-template-columns:repeat(5,1fr);overflow:visible;padding:4px 0 14px}}
.chap{scroll-snap-align:start;position:relative;border:0;padding:0;border-radius:var(--r-lg);overflow:hidden;cursor:pointer;text-align:left;color:#fff;background:var(--ink);box-shadow:var(--shadow);transition:transform .25s ease;display:flex;flex-direction:column}
.chap:active{transform:scale(.97)}
@media (hover:hover){.chap:hover{transform:translateY(-4px)}}
.chap .scene{display:block;width:100%;aspect-ratio:16/10;height:auto}
.chap .cap{display:block;padding:12px 16px 16px;flex:1}
.chap .cap b{display:block;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.chap .cap .d{display:block;font-size:.8rem;color:var(--lantern);font-weight:600}
.chap .cap .l{display:block;font-size:.86rem;color:#d7e3e0;margin-top:4px;line-height:1.35}
.chap .count-b{position:absolute;top:12px;right:12px;font-size:.75rem;background:rgba(13,28,38,.6);backdrop-filter:blur(6px);padding:4px 10px;border-radius:999px}
.chap.here{outline:3px solid var(--lantern);outline-offset:3px}

/* ---------- sheet ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:760px;max-height:92dvh;border-radius:var(--r-lg) var(--r-lg) 0 0;background:var(--bg);color:var(--text);overflow:auto;overscroll-behavior:contain}
@media (min-width:960px){dialog.sheet{margin:auto;border-radius:var(--r-lg);max-height:88dvh}}
dialog.sheet[open]{animation:sheetUp .35s cubic-bezier(.2,.9,.3,1)}
dialog.sheet::backdrop{background:rgba(13,28,38,.6);backdrop-filter:blur(3px)}
@keyframes sheetUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet-hero{position:relative;height:240px;color:#fff}
.sheet-hero .scene{position:absolute;inset:0;width:100%;height:100%}
.sheet-hero .t{position:absolute;inset:auto 0 0 0;padding:40px 20px 16px;background:linear-gradient(180deg,transparent,rgba(13,28,38,.9))}
.sheet-hero h2{font-size:2.2rem;color:#fff}
.sheet-close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(13,28,38,.6);color:#fff;font-size:1.3rem;cursor:pointer;backdrop-filter:blur(6px)}
.sheet-body{padding:16px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:18px}

/* ---------- reels ---------- */
.reels{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.reel{border-radius:var(--r-md);overflow:hidden;background:var(--surface);border:1px solid var(--line);position:relative}
.reel iframe{display:block;width:100%;height:560px;border:0;background:#fff}
.reel-ph{height:560px;display:flex;flex-direction:column;justify-content:flex-end;padding:18px;color:#fff;position:relative;overflow:hidden;cursor:pointer;border:0;width:100%;text-align:left}
.reel-ph::before{content:"";position:absolute;inset:0;background:conic-gradient(from 200deg at 30% 30%,#e06a8c,#f2b134,#1d7a6c,#3e7cb1,#e06a8c);opacity:.9;animation:spin 14s linear infinite;transform:scale(1.6)}
@keyframes spin{to{transform:scale(1.6) rotate(360deg)}}
.reel-ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,28,38,.1),rgba(13,28,38,.85))}
.reel-ph > *{position:relative;z-index:1}
.reel-ph .play{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(6px);display:grid;place-items:center;margin-bottom:auto;align-self:center;margin-top:170px;transition:transform .2s}
.reel-ph:hover .play{transform:scale(1.08)}
.reel-ph .play svg{width:26px;height:26px;fill:#fff;margin-left:4px}
.reel-ph b{font-size:1.1rem;line-height:1.25}
.reel-ph span{font-size:.82rem;color:#d7e3e0}
.reel .ext{position:absolute;top:8px;right:8px;z-index:2}

/* ---------- live weather ---------- */
.wxlive{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(132px,1fr);gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.wxlive::-webkit-scrollbar{display:none}
.wxc{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-md);padding:12px;display:grid;gap:2px}
.wxc .ico{display:flex;justify-content:space-between;align-items:start}
.wx-ico{width:42px;height:46px}
.wxc .now{font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1}
.wxc .c{font-weight:600;font-size:.9rem}
.wxc .s{font-size:.78rem;color:var(--muted)}
.wx-sun{animation:spinr 18s linear infinite;transform-origin:20px 20px}
@keyframes spinr{to{transform:rotate(360deg)}}
.wx-cloud{animation:cdrift 4s ease-in-out infinite}
@keyframes cdrift{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
.wx-rain line{animation:drop 1s linear infinite}.wx-rain line:nth-child(2){animation-delay:-.33s}.wx-rain line:nth-child(3){animation-delay:-.66s}
@keyframes drop{0%{transform:translateY(-3px);opacity:0}50%{opacity:1}100%{transform:translateY(4px);opacity:0}}
.wx-bolt{animation:tw 1.6s steps(2) infinite}
.wxc .ico .wx-cloud[transform]{animation:none}

/* ---------- route card ---------- */
.duo{display:grid;gap:12px}
.duo > *{min-width:0}
@media (min-width:700px){.duo{grid-template-columns:1fr 1.3fr;align-items:start}}
.routecard{background:var(--ink);border-radius:var(--r-lg);padding:14px 10px;color:#e8f0ed}
.routecard .route{max-height:340px;display:block;margin:0 auto;width:100%}
.route:not(.go) .path,.route:not(.go) .dot,.route:not(.go) text{animation-play-state:paused}

/* ---------- phrases ---------- */
.phrases{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.phrase{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:12px;text-align:left;cursor:pointer;display:grid;gap:2px;transition:transform .15s,border-color .15s}
.phrase:active{transform:scale(.97)}
.phrase .vi{font-weight:600;font-size:1.02rem}
.phrase .pr{font-size:.8rem;color:var(--jade);font-style:italic}
.phrase .en{font-size:.82rem;color:var(--muted)}
.phrase.talking{border-color:var(--lantern);box-shadow:0 0 0 4px color-mix(in srgb,var(--lantern) 25%,transparent)}
.phrase .wave{display:inline-flex;gap:2px;align-items:end;height:12px;margin-left:6px;vertical-align:middle}
.phrase .wave i{width:3px;background:var(--lantern);border-radius:2px;height:4px}
.phrase.talking .wave i{animation:eq .5s ease-in-out infinite alternate}
.phrase.talking .wave i:nth-child(2){animation-delay:-.2s}.phrase.talking .wave i:nth-child(3){animation-delay:-.35s}
@keyframes eq{to{height:12px}}

/* ---------- food flip cards ---------- */
.foodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.fcard{perspective:900px;height:210px;cursor:pointer;border:0;padding:0;background:none;text-align:left}
.fcard .in{position:relative;width:100%;height:100%;transition:transform .55s cubic-bezier(.3,.8,.3,1);transform-style:preserve-3d}
.fcard.flip .in{transform:rotateY(180deg)}
.fcard .f,.fcard .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);padding:12px;display:flex;flex-direction:column}
.fcard .f{align-items:center;justify-content:center;gap:6px;background:radial-gradient(circle at 50% 38%,var(--jade-soft),var(--surface) 70%)}
.fcard .f .food-svg{width:92px;height:92px}
.fcard .f b{font-family:var(--display);font-weight:800;font-size:1.15rem}
.fcard .b{transform:rotateY(180deg);gap:6px;font-size:.86rem}
.fcard .b b{font-size:1rem}
.fcard .b .w{color:var(--muted);font-size:.8rem;margin-top:auto}
.fcard .ate{position:absolute;top:8px;left:8px;font-size:.7rem;background:var(--jade);color:#fff;border-radius:999px;padding:2px 8px;display:none}
.fcard.done .ate{display:inline-block}
.fcard .b .tick{align-self:start;margin-top:4px}

@media (min-width:960px){
  .hero2,.chapters{width:min(1240px,calc(100vw - 96px - 64px));margin-left:50%;margin-right:0;transform:translateX(-50%)}
  .wxlive{grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));overflow:visible}
}

/* ---------- trips home ---------- */
.hero2 .homelink{text-decoration:none;background:rgba(13,28,38,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:6px 12px;border-radius:999px;font-weight:600}
.tripgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-bottom:24px}
.tripcard{position:relative;border:0;padding:0;border-radius:var(--r-lg);overflow:hidden;aspect-ratio:4/3;color:#fff;background:var(--ink);cursor:pointer;text-align:left;box-shadow:var(--shadow);transition:transform .25s}
@media (hover:hover){.tripcard:hover{transform:translateY(-4px)}}
.tripcard .scene{position:absolute;inset:0;width:100%;height:100%}
.tripcard .tc{position:absolute;inset:auto 0 0 0;padding:40px 16px 16px;background:linear-gradient(180deg,transparent,rgba(13,28,38,.9));display:block}
.tripcard .tc b{display:block;font-family:var(--display);font-weight:800;font-size:1.6rem;line-height:1.05}
.tripcard .ph{display:inline-block;font-size:.75rem;font-weight:600;color:var(--ink);background:var(--lantern);border-radius:999px;padding:2px 10px;margin-bottom:6px}
.tripcard .dt{display:block;font-size:.85rem;color:#d7e3e0;margin-top:4px}
.tripcard.cur{outline:3px solid var(--lantern);outline-offset:3px}
.tripcard.next{display:flex;flex-direction:column;justify-content:center;gap:6px;padding:20px;background:transparent;color:var(--muted);border:2px dashed var(--line);box-shadow:none;cursor:default}
.tripcard.next b{color:var(--text);font-family:var(--display);font-size:1.3rem}

/* ---------- sync + forex ---------- */
.sync-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.pill{font-size:.75rem;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--mist);color:var(--muted)}
.pill.on{background:var(--jade);color:#fff}.pill.busy{background:var(--lantern);color:var(--ink)}.pill.err{background:var(--lotus);color:#fff}
.sync-setup summary{list-style:none;cursor:pointer;margin-top:10px;display:inline-flex}
.sync-setup summary::-webkit-details-marker{display:none}
.sync-setup[open] summary{display:none}
.sync-setup ol{padding-left:18px;margin:10px 0;display:grid;gap:6px}
.starpin{filter:drop-shadow(0 2px 3px rgba(0,0,0,.35));animation:starpop 2.6s ease-in-out infinite}
@keyframes starpop{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

/* ---------- outfits ---------- */
.outfit{background:var(--mist);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-top:10px}
.ofit{display:grid;grid-template-columns:32px 1fr;gap:10px;align-items:start;padding:6px 0}
.ofit + .ofit{border-top:1px dashed var(--line)}
.who-av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;color:#fff;background:var(--jade)}
.ofit + .ofit .who-av{background:var(--lotus)}
.ofit b{font-size:.92rem}

/* ---------- sim ---------- */
.simsteps{margin:6px 0 0;padding:0;list-style:none;counter-reset:s;display:grid;gap:8px}
.simsteps li{counter-increment:s;display:grid;grid-template-columns:26px 1fr;gap:10px;font-size:.92rem;align-items:start}
.simsteps li::before{content:counter(s);width:26px;height:26px;border-radius:50%;background:var(--jade);color:#fff;display:grid;place-items:center;font-weight:700;font-size:.8rem}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}
  .route .path{stroke-dashoffset:0}
}
</style>
</head>
<body>

<div id="lock">
  <form class="box" id="lockForm" autocomplete="on">
    <h1>Our<span>trips</span></h1>
    <p>Our travel guides, every trip in one place.</p>
    <input type="text" name="username" value="our-trips" autocomplete="username" hidden>
    <label for="pw">Password</label>
    <input id="pw" type="password" autocomplete="current-password" required autofocus>
    <label class="row"><input type="checkbox" id="remember" checked> Keep me signed in on this device</label>
    <button class="btn gold full" type="submit" id="unlockBtn">Open the guide</button>
    <div class="err" id="lockErr" role="alert"></div>
  </form>
</div>

<div id="app" class="hidden">
  <nav class="tabs" aria-label="Sections">
    <a href="#trip" data-v="trip"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg>Trip</a>
    <a href="#map" data-v="map"><svg viewBox="0 0 24 24"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2z"/><path d="M9 4v14M15 6v14"/></svg>Map</a>
    <a href="#finds" data-v="finds"><svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4z"/></svg>Saved</a>
    <a href="#wallet" data-v="wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="14" rx="2"/><path d="M3 10h18M16 15h2"/><path d="M6 6l9-3 1 3"/></svg>Wallet</a>
    <a href="#pack" data-v="pack"><svg viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="13" rx="2"/><path d="M9 7V4h6v3M9 20v1M15 20v1M9 11h6"/></svg>Pack</a>
  </nav>

  <main>
    <section class="view" id="view-trips"></section>
    <section class="view" id="view-trip"></section>
    <section class="view" id="view-map">
      <div class="map-tools">
        <div class="vh" style="padding:10px 0 0"><h2>Map</h2><span class="small muted" id="pinCount"></span></div>
        <div class="scroller" id="cityChips"></div>
        <div class="scroller" id="catChips"></div>
      </div>
      <div id="map" role="application" aria-label="Map of saved places"></div>
      <div class="map-actions">
        <button class="btn sm ghost" id="locateBtn">Show where I am</button>
        <button class="btn sm ghost" id="saveTilesBtn">Save this area offline</button>
        <button class="btn sm ghost" id="kmlBtn">Export KML</button>
        <button class="btn sm ghost" id="gpxBtn">Export GPX</button>
      </div>
    </section>
    <section class="view" id="view-finds"></section>
    <section class="view" id="view-wallet"></section>
    <section class="view" id="view-pack"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

/* ---------- crypto unlock ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(PAYLOAD.salt), iterations:PAYLOAD.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(PAYLOAD.iv)}, key, b64(PAYLOAD.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
async function tryUnlock(pw, silent){
  try{
    const data = await decrypt(pw);
    SITEPW = pw;
    if($('#remember').checked || silent) LS.set('pw', pw);
    $('#lock').remove(); $('#app').classList.remove('hidden');
    boot(data);
    return true;
  }catch(e){
    if(!silent){ $('#lockErr').textContent = 'That password did not open the guide. Check it and try again.'; $('#pw').select(); }
    else LS.del('pw');
    return false;
  }
}
$('#lockForm').addEventListener('submit', async e => {
  e.preventDefault(); $('#unlockBtn').textContent='Opening…';
  const ok = await tryUnlock($('#pw').value, false);
  if(!ok) $('#unlockBtn').textContent='Open the guide';
});
(async () => { const pw = LS.get('pw'); if(pw) await tryUnlock(pw, true); })();

function pickTrip(trips){
  const saved = LS.get('trip'); if(saved && trips.some(t=>t.trip.slug===saved)) return saved;
  const today = new Date().toISOString().slice(0,10);
  const live = trips.filter(t=>t.trip.end >= today).sort((a,b)=>a.trip.start.localeCompare(b.trip.start));
  return (live[0] || trips[trips.length-1]).trip.slug;
}
function boot(data){
  ALL = data.trips || [data];
  const slug = pickTrip(ALL);
  D = ALL.find(t=>t.trip.slug===slug);
  LS.scope = slug + '_'; TZ = D.trip.tz || 'UTC'; CITY = D.cities || {}; wxData = LS.get('wx', null);
  document.title = D.trip.title + ' | Our trips';
  renderHome(); renderTrip(); renderFinds(); renderWallet(); renderPack(); startSync();
  window.addEventListener('hashchange', route);
  route();
  if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
}

function route(){
  const v = (location.hash.replace('#','') || 'trip').split('-')[0];
  const views = ['trips','trip','map','finds','wallet','pack'];
  const cur = views.includes(v) ? v : 'trip';
  views.forEach(x => $('#view-'+x).classList.toggle('on', x===cur));
  $$('nav.tabs a').forEach(a => { if(a.dataset.v===cur) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });

/* ---------- TRIP ---------- */
function tripState(){
  const t = todayISO();
  const {start, end} = D.trip;
  if(t < start) return {phase:'before', days: daysBetween(t, start)};
  if(t > end) return {phase:'after'};
  const day = D.days.find(d => d.date===t) || D.days[0];
  return {phase:'during', day};
}
function stopIndexFor(state){
  if(state.phase==='before') return -1;
  if(state.phase==='after') return 99;
  const d = state.day.date;
  let idx = -1; D.stops.forEach((s,i)=>{ if(d >= s.from) idx=i; });
  return idx;
}
function routeSVG(hereIdx){
  // project the trip's own stops into a box; the country's shape emerges from them
  const R = D.route; if(!R) return '';
  const W=320, H=360, pad=40;
  const lats=R.points.map(p=>p.lat), lngs=R.points.map(p=>p.lng);
  let lat0=Math.min(...lats), lat1=Math.max(...lats), lng0=Math.min(...lngs), lng1=Math.max(...lngs);
  const span=Math.max(lat1-lat0, (lng1-lng0)*H/W, .5), cLat=(lat0+lat1)/2, cLng=(lng0+lng1)/2;
  const sx=(W-2*pad)/(span*W/H), sy=(H-2*pad)/span;
  const x = lng => W/2 + (lng-cLng)*sx, y = lat => H/2 - (lat-cLat)*sy;
  const P = R.points.map(p => ({name:p.n, x:x(p.lng), y:y(p.lat)}));
  const order = R.order || P.map((_,i)=>i);
  let d=''; order.forEach((k,i)=>{ const p=P[k]; if(i===0){ d+=`M${p.x.toFixed(1)},${p.y.toFixed(1)}`; } else { const q=P[order[i-1]]; const mx=(p.x+q.x)/2 + (i%2?14:-14), my=(p.y+q.y)/2; d+=` Q${mx.toFixed(1)},${my.toFixed(1)} ${p.x.toFixed(1)},${p.y.toFixed(1)}`; } });
  const map = R.stopToPoint || [];
  const hereP = hereIdx>=0 && hereIdx<map.length ? map[hereIdx] : -1;
  let dots='', txt='';
  P.forEach((p,i)=>{
    const here = i===hereP, delay=(0.5+i*0.45).toFixed(2), right = p.x < W*0.62;
    if(here) dots += `<circle class="glow" cx="${p.x}" cy="${p.y}" r="7"/>`;
    dots += `<circle class="dot ${here?'here':''}" cx="${p.x}" cy="${p.y}" r="${here?6:4.5}" style="animation-delay:${delay}s"/>`;
    txt += `<text class="${here?'here':''}" x="${p.x+(right?12:-12)}" y="${p.y+4}" text-anchor="${right?'start':'end'}" style="animation-delay:${delay}s">${esc(p.name)}</text>`;
  });
  return `<svg class="route" viewBox="0 0 ${W} ${H}" role="img" aria-label="Route: ${esc(P.map(p=>p.name).join(', '))}">
    <path class="path" d="${d}" pathLength="1000" style="--len:1000"/>
    ${dots}${txt}</svg>`;
}

/* ---------- TRIP (rich) ---------- */

function startCountdown(){
  clearInterval(countTimer); const el=$('#count'); if(!el) return;
  const target = new Date(D.trip.departure || (D.trip.start+'T00:00:00')).getTime();
  const tick = () => { let s=Math.max(0, Math.floor((target-Date.now())/1000));
    const parts={d:Math.floor(s/86400), h:Math.floor(s%86400/3600), m:Math.floor(s%3600/60), s:s%60};
    for(const k in parts){ const b=el.querySelector(`[data-u="${k}"]`); const val=String(parts[k]).padStart(2,'0'); if(b && b.textContent!==val) b.textContent=val; } };
  tick(); countTimer=setInterval(tick,1000);
}
function parallax(){
  const hero=$('#hero'); if(!hero || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const layers=$$('[data-depth]', hero); let px=0, py=0, sy=0, raf=0;
  const apply=()=>{ raf=0; layers.forEach(l=>{ const d=+l.dataset.depth; l.style.transform=`translate(${(px*d*40).toFixed(1)}px, ${(sy*d*.5 + py*d*20).toFixed(1)}px)`; }); };
  const req=()=>{ if(!raf) raf=requestAnimationFrame(apply); };
  hero.addEventListener('pointermove', e=>{ const r=hero.getBoundingClientRect(); px=(e.clientX-r.left)/r.width-.5; py=(e.clientY-r.top)/r.height-.5; req(); });
  window.addEventListener('scroll', ()=>{ if(location.hash && location.hash!=='#trip') return; sy=Math.min(window.scrollY, 700); req(); }, {passive:true});
  window.addEventListener('deviceorientation', e=>{ if(e.gamma==null) return; px=Math.max(-.5,Math.min(.5,e.gamma/60)); py=Math.max(-.5,Math.min(.5,(e.beta-45)/90)); req(); }, {passive:true});
}
function watchRoute(){
  const r=$('.routecard .route'); if(!r) return;
  if(!('IntersectionObserver' in window)){ r.classList.add('go'); return; }
  const io=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ r.classList.add('go'); io.disconnect(); } }),{threshold:.35}); io.observe(r);
}

/* ---------- phrases ---------- */
function speak(btn){
  const [vi,pr] = D.phrases[+btn.dataset.ph];
  if(!('speechSynthesis' in window)){ toast(`Say it like: ${pr}`); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(vi); u.lang=D.trip.lang||'en'; u.rate=.85;
  const pre=(D.trip.lang||'en').slice(0,2).toLowerCase(); const voice=speechSynthesis.getVoices().find(v=>v.lang.toLowerCase().startsWith(pre)); if(voice) u.voice=voice;
  else toast(`No ${D.trip.langName||'local'} voice on this device. Say it like: ${pr}`);
  $$('.phrase.talking').forEach(x=>x.classList.remove('talking')); btn.classList.add('talking');
  u.onend=u.onerror=()=>btn.classList.remove('talking'); speechSynthesis.speak(u);
}
if('speechSynthesis' in window) speechSynthesis.getVoices();

/* ---------- live weather (Open-Meteo, no key) ---------- */
const wxCities = () => (D.chapters||[]).filter(c=>c.wx).map(c=>({id:c.id, n:c.wx.name, lat:c.wx.lat, lng:c.wx.lng, from:c.wx.from, to:c.wx.to}));
function wxCardsHTML(){
  return wxCities().map((c,i)=>{ const w=wxData && wxData.list && wxData.list[i];
    if(!w) return `<div class="wxc"><div class="ico">${wxIcon(2)}</div><span class="c">${c.n}</span><span class="s">Forecast loads when online</span></div>`;
    const stay = w.stay ? `${w.stay.min}° to ${w.stay.max}° while we're there` : 'Stay dates beyond the 16-day forecast';
    return `<div class="wxc" title="${esc(WXTXT(w.code))}"><div class="ico">${wxIcon(w.code)}<span class="now">${Math.round(w.temp)}°</span></div><span class="c">${c.n}</span><span class="s">${esc(WXTXT(w.code))}</span><span class="s">${esc(stay)}</span></div>`; }).join('');
}
async function loadWeather(){
  if(wxData && Date.now()-wxData.at < 30*60*1000) return;
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+wxCities().map(c=>c.lat).join(',')+'&longitude='+wxCities().map(c=>c.lng).join(',')+'&current=temperature_2m,weather_code&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone='+encodeURIComponent(D.trip.tz||'UTC')+'&forecast_days=16';
    const r=await fetch(url); const j=await r.json(); const arr=Array.isArray(j)?j:[j];
    const CS=wxCities(); const list=arr.map((x,i)=>{ const c=CS[i], d=x.daily; let mins=[],maxs=[];
      d.time.forEach((t,k)=>{ if(t>=c.from && t<=c.to){ mins.push(d.temperature_2m_min[k]); maxs.push(d.temperature_2m_max[k]); } });
      return {temp:x.current.temperature_2m, code:x.current.weather_code, stay: mins.length?{min:Math.round(Math.min(...mins)), max:Math.round(Math.max(...maxs))}:null}; });
    wxData={at:Date.now(), list}; LS.set('wx', wxData);
    const el=$('#wxLive'); if(el){ el.innerHTML=wxCardsHTML(); $('#wxNote').textContent='Live from Open-Meteo, updated just now'; }
  }catch(e){ const n=$('#wxNote'); if(n) n.textContent = wxData ? `Offline. Showing the forecast from ${ago(wxData.at)}` : 'Connect to the internet to load the forecast'; }
}

/* ---------- reels ---------- */
function reelHTML(r, lazy=true){
  return `<div class="reel" data-code="${esc(r.c)}">
    <button class="reel-ph" data-load="${esc(r.c)}" aria-label="Play reel: ${esc(r.t)}"><span class="play">${PLAY}</span><b>${esc(r.t)}</b><span>@${esc(r.u)}</span></button>
    <a class="iconbtn ext" href="https://www.instagram.com/p/${esc(r.c)}/" target="_blank" rel="noopener" aria-label="Open in Instagram">${ICON.ig}</a></div>`;
}
function loadReel(card){
  if(!card || card.dataset.loaded) return; card.dataset.loaded='1';
  if(!navigator.onLine){ card.querySelector('.reel-ph span:last-child').textContent='Reels need the internet'; card.dataset.loaded=''; return; }
  const f=document.createElement('iframe'); f.src=`https://www.instagram.com/p/${card.dataset.code}/embed/`; f.loading='lazy'; f.allow='autoplay; encrypted-media; picture-in-picture'; f.setAttribute('allowtransparency','true'); f.title='Instagram reel';
  card.querySelector('.reel-ph').replaceWith(f);
}
let reelIO=null;
function wireReels(root){
  $$('[data-load]', root).forEach(b=>b.onclick=()=>loadReel(b.closest('.reel')));
  if(!('IntersectionObserver' in window)) return;
  if(!reelIO) reelIO=new IntersectionObserver(es=>es.forEach(e=>{ if(e.isIntersecting){ loadReel(e.target); reelIO.unobserve(e.target); } }),{rootMargin:'200px 0px'});
  $$('.reel', root).forEach(r=>reelIO.observe(r));
}

/* ---------- chapter sheet ---------- */
function openChapter(id){
  const c=D.chapters.find(x=>x.id===id), h=hotelById(c.hotel), dlg=$('#sheet');
  const places=D.places.map((p,i)=>({...p,i})).filter(p=>p.city===c.map && p.c!=='transit' && p.c!=='stay');
  const days=D.days.filter(d=>d.n>=c.days[0] && d.n<=c.days[1]);

/* ---------- SYNC: wallet, journal and checklists across devices ----------
   Storage: one secret GitHub gist (description "our-trips-sync"), one file per trip.
   Everything is AES-GCM encrypted with the site password before upload, so the gist
   holds only ciphertext. The GitHub token lives in this browser's storage only. */
const SYNC_DESC = 'our-trips-sync';
const SYNC_MAPS = ['journal','shots','pack','ate'];
let SITEPW = null, syncBusy = false, syncTimer = null, syncLast = null, syncErr = null;
const syncCfg = () => LS.get('sync', null);
const keyCache = {};

function setMapEntry(name, k, v){
  const m = LS.get(name, {}); m[k] = v; LS.set(name, m);
  const ts = LS.get('ts', {}); ts[name+':'+k] = Date.now(); LS.set('ts', ts);
  scheduleSync();
}
function scheduleSync(delay=2500){ if(!syncCfg()) return; clearTimeout(syncTimer); syncTimer=setTimeout(syncNow, delay); }

async function syncKey(saltB64){
  if(keyCache[saltB64]) return keyCache[saltB64];
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(SITEPW), 'PBKDF2', false, ['deriveKey']);
  return keyCache[saltB64] = crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(saltB64), iterations:150000, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
}
const toB64 = u8 => btoa(String.fromCharCode(...new Uint8Array(u8)));
let syncSalt = null;
async function sealBundle(obj){
  if(!syncSalt) syncSalt = toB64(crypto.getRandomValues(new Uint8Array(16)));
  const iv = crypto.getRandomValues(new Uint8Array(12)), key = await syncKey(syncSalt);
  const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({v:1, salt:syncSalt, iv:toB64(iv), ct:toB64(ct)});
}
async function openBundle(text){
  const e = JSON.parse(text); syncSalt = syncSalt || e.salt;
  const key = await syncKey(e.salt);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(e.iv)}, key, b64(e.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

function localBundle(){
  const w = LS.get('wallet', {txns:[], del:[]});
  const maps = {}; SYNC_MAPS.forEach(n => maps[n] = LS.get(n, {}));
  return {txns:w.txns||[], del:w.del||[], maps, ts:LS.get('ts', {})};
}
function mergeBundles(a, b){
  const del = [...new Set([...(a.del||[]), ...(b.del||[])])], dels = new Set(del);
  const byId = {}; [...(a.txns||[]), ...(b.txns||[])].forEach(t => { if(!dels.has(t.id)) byId[t.id] = t; });
  const txns = Object.values(byId).sort((x,y)=>x.ts-y.ts);
  const ts = {...(a.ts||{})}, maps = {};
  SYNC_MAPS.forEach(n => {
    const am = (a.maps||{})[n]||{}, bm = (b.maps||{})[n]||{}; maps[n] = {};
    new Set([...Object.keys(am), ...Object.keys(bm)]).forEach(k => {
      const ta = (a.ts||{})[n+':'+k]||0, tb = (b.ts||{})[n+':'+k]||0;
      if(tb > ta){ maps[n][k] = bm[k]; ts[n+':'+k] = tb; } else maps[n][k] = (k in am) ? am[k] : bm[k];
    });
  });
  return {txns, del, maps, ts};
}
function applyBundle(m){
  const before = JSON.stringify(localBundle());
  const w = LS.get('wallet', null) || {txns:[], rate:{vnd:WL().fallbackRate, inr:WL().fallbackHome, at:null, live:false}};
  w.txns = m.txns; w.del = m.del; LS.set('wallet', w); W = w;
  SYNC_MAPS.forEach(n => LS.set(n, m.maps[n]||{})); LS.set('ts', m.ts||{});
  return before !== JSON.stringify(localBundle());
}

async function gh(path, opts={}){
  const r = await fetch('https://api.github.com'+path, {...opts, headers:{'Accept':'application/vnd.github+json','Authorization':'Bearer '+syncCfg().token, ...(opts.body?{'Content-Type':'application/json'}:{})}, cache:'no-store'});
  if(r.status===401) throw new Error('GitHub refused the token. It may have expired, so create a new one');
  if(!r.ok) throw new Error('GitHub error '+r.status);
  return r.json();
}
async function ensureGist(){
  const cfg = syncCfg(); if(cfg.gist) return cfg.gist;
  const list = await gh('/gists?per_page=100');
  let g = list.find(x => x.description === SYNC_DESC);
  if(!g) g = await gh('/gists', {method:'POST', body:JSON.stringify({description:SYNC_DESC, public:false, files:{'README.txt':{content:'Encrypted sync data for Our trips. Unreadable without the site password.'}}})});
  LS.set('sync', {...cfg, gist:g.id}); return g.id;
}

async function syncNow(){
  if(!syncCfg() || syncBusy || !SITEPW) return;
  if(!navigator.onLine){ syncErr='Offline. Changes will sync when you reconnect'; paintSync(); return; }
  syncBusy = true; syncErr = null; paintSync();
  try{
    const id = await ensureGist(), file = D.trip.slug + '.json';
    const g = await gh('/gists/'+id);
    let remote = {txns:[], del:[], maps:{}, ts:{}};
    const f = g.files && g.files[file];
    if(f){ let text = f.content; if(f.truncated) text = await (await fetch(f.raw_url, {cache:'no-store'})).text(); remote = await openBundle(text); }
    const merged = mergeBundles(localBundle(), remote);
    const changed = applyBundle(merged);
    const sealed = await sealBundle(merged);
    if(!f || JSON.stringify(mergeBundles(remote, {})) !== JSON.stringify(mergeBundles(merged, {})))
      await gh('/gists/'+id, {method:'PATCH', body:JSON.stringify({files:{[file]:{content:sealed}}})});
    syncLast = Date.now(); LS.set('syncAt', syncLast);
    if(changed) refreshAfterSync();
  }catch(e){
    syncErr = /decrypt|operation/i.test(String(e)) ? 'Sync data was saved with a different password. Rebuild with the same password on every device' : (e.message || 'Sync failed');
  }finally{ syncBusy = false; paintSync(); }
}
function refreshAfterSync(){
  const v = (location.hash.replace('#','')||'trip');
  if(v==='wallet') drawWallet();
  if(v==='pack'){ const y=window.scrollY; renderPack(); window.scrollTo(0,y); }
  if(v==='finds') drawFinds();
  const j = LS.get('journal',{}), shots = LS.get('shots',{});
  $$('.journal textarea').forEach(t => { if(document.activeElement!==t) t.value = j[t.dataset.d]||''; });
  $$('.shot input').forEach(c => c.checked = !!shots[c.dataset.k]);
  toast('Synced with your other devices');
}

function syncPanelHTML(){
  const cfg = syncCfg(), at = syncLast || LS.get('syncAt', null);
  if(!cfg) return `<div class="panel sync">
    <div class="sync-h"><b>Sync across phones</b><span class="pill off">Off</span></div>
    <p class="small muted">Right now the wallet, journal and checklists live only on this device. Turn on sync and both phones show the same numbers.</p>
    <details class="sync-setup"><summary class="btn sm">Set up sync</summary>
      <ol class="small">
        <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=Our%20trips%20sync" target="_blank" rel="noopener">Create a GitHub token</a>. Only the <b>gist</b> box should be ticked. Set expiry to 90 days, then click Generate.</li>
        <li>Copy the token and paste it below. Do this once on each phone (the same token works on both).</li>
      </ol>
      <div class="field"><label for="syncTok">GitHub token</label><input id="syncTok" type="password" autocomplete="off" spellcheck="false" placeholder="ghp_…"></div>
      <button class="btn full" id="syncSave" style="margin-top:10px">Turn on sync</button>
      <p class="small muted" style="margin-top:8px">Everything is encrypted with the site password before it leaves this phone, so GitHub only stores scrambled text. The token stays on this device.</p>
    </details></div>`;
  const state = syncBusy ? ['Syncing…','busy'] : syncErr ? ['Needs attention','err'] : ['On','on'];
  return `<div class="panel sync">
    <div class="sync-h"><b>Sync across phones</b><span class="pill ${state[1]}">${state[0]}</span></div>
    <p class="small ${syncErr?'':'muted'}" style="${syncErr?'color:var(--lotus)':''}">${esc(syncErr || (at ? `Last synced ${ago(at)}. Wallet, journal and checklists match on every signed-in device.` : 'Waiting for the first sync'))}</p>
    <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap"><button class="btn sm" id="syncGo">Sync now</button><button class="btn sm ghost" id="syncOff">Turn off on this device</button></div></div>`;
}
function paintSync(){
  const el = $('#syncPanel'); if(!el) return;
  el.innerHTML = syncPanelHTML();
  const save = $('#syncSave', el); if(save) save.onclick = () => {
    const tok = $('#syncTok', el).value.trim();
    if(!/^(ghp_|github_pat_)/.test(tok)){ toast('That does not look like a GitHub token'); return; }
    LS.set('sync', {token:tok}); toast('Sync is on'); syncNow();
  };
  const go = $('#syncGo', el); if(go) go.onclick = () => syncNow();
  const off = $('#syncOff', el); if(off) off.onclick = () => { if(confirm('Stop syncing on this device? Your data stays here and in the cloud.')){ LS.del('sync'); syncErr=null; paintSync(); } };
}
function startSync(){
  setTimeout(syncNow, 1500);
  window.addEventListener('online', () => syncNow());
  document.addEventListener('visibilitychange', () => { if(document.visibilityState==='visible') syncNow(); });
  setInterval(() => { if(document.visibilityState==='visible') syncNow(); }, 90000);
}

let filterCity='all', filterCat=new Set(Object.keys(CAT));
function initMap(){
  if(mapReady) return; mapReady = true;
  if(typeof L === 'undefined'){ $('#map').innerHTML='<div class="empty">The map library could not load. Open the guide once while online so it is saved for offline use.</div>'; return; }
  map = L.map('map', {zoomControl:true, attributionControl:true}).setView([16, 106], 5);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19, attribution:'© OpenStreetMap'}).addTo(map);
  const stops = D.stops.map(s=>[s.lat,s.lng]);
  L.polyline(stops, {color:'#f2b134', weight:3, dashArray:'6 8', opacity:.9}).addTo(map);
  D.places.forEach((p,i) => {
    const icon = p.c==='forex' ? L.divIcon({className:'', html:`<svg class="starpin" viewBox="0 0 24 24" width="30" height="30"><path d="M12 2.2l2.9 6.2 6.8.8-5 4.7 1.3 6.7L12 17.3 6 20.6l1.3-6.7-5-4.7 6.8-.8z" fill="#d7263d" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`, iconSize:[30,30], iconAnchor:[15,15]}) : L.divIcon({className:'', html:`<div class="pin ${p.c==='stay'?'stay':''}" style="background:${CAT[p.c].color}"></div>`, iconSize:p.c==='stay'?[24,24]:[18,18], iconAnchor:p.c==='stay'?[12,12]:[9,9]});
    const m = L.marker([p.lat,p.lng], {icon, title:p.n, zIndexOffset:p.c==='forex'?800:0}).bindPopup(popupHTML(p));
    m._p = p; m._i = i; markers.push(m);
  });
  $('#cityChips').innerHTML = [['all','All '+D.trip.country],...Object.entries(CITY)].map(([k,v])=>`<button class="chip" data-city="${k}" aria-pressed="${k==='all'}">${v}</button>`).join('');
  $('#catChips').innerHTML = Object.entries(CAT).map(([k,v])=>`<button class="chip" data-cat="${k}" aria-pressed="true"><i style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${v.color}"></i>${v.label}</button>`).join('');
  $$('#cityChips .chip').forEach(b=>b.onclick=()=>{ filterCity=b.dataset.city; $$('#cityChips .chip').forEach(x=>x.setAttribute('aria-pressed', x===b)); applyFilters(true); });
  $$('#catChips .chip').forEach(b=>b.onclick=()=>{ const k=b.dataset.cat; filterCat.has(k)?filterCat.delete(k):filterCat.add(k); b.setAttribute('aria-pressed', filterCat.has(k)); applyFilters(false); });
  applyFilters(true);
  $('#locateBtn').onclick = locate;
  $('#kmlBtn').onclick = () => download(D.trip.slug+'.kml', toKML(), 'application/vnd.google-earth.kml+xml');
  $('#gpxBtn').onclick = () => download(D.trip.slug+'.gpx', toGPX(), 'application/gpx+xml');
  $('#saveTilesBtn').onclick = saveTiles;
  if(pendingFly!=null){ const i=pendingFly; pendingFly=null; setTimeout(()=>flyTo(i),120); }
}
function popupHTML(p){
  return `<b>${esc(p.n)}</b><br><span style="color:#5b6f77">${esc(CAT[p.c].label)}, ${esc(CITY[p.city])}</span>
  ${p.note?`<div style="margin-top:6px">${esc(p.note)}</div>`:''}
  <div class="pl"><a href="${gmapsURL(p.n, CITY[p.city].split(' &')[0])}" target="_blank" rel="noopener">Open in Google Maps</a>
  ${p.src?`<a href="${igURL(p.src)}" target="_blank" rel="noopener">Saved reel</a>`:''}</div>`;
}
function applyFilters(fit){
  if(!map) return;
  const vis = [];
  markers.forEach(m => { const p=m._p; const show = (filterCity==='all' || p.city===filterCity) && filterCat.has(p.c); if(show){ m.addTo(map); vis.push(m); } else m.remove(); });
  $('#pinCount').textContent = vis.length + ' places';
  if(fit && vis.length){ map.fitBounds(L.featureGroup(vis).getBounds().pad(0.15), {maxZoom:14}); }
}
let pendingFly=null;
function flyTo(i){
  if(location.hash!=='#map'){ pendingFly=i; location.hash='#map'; if(mapReady){ setTimeout(()=>{ const j=pendingFly; pendingFly=null; flyTo(j); },120); } return; }
  const m = markers[i]; if(!m) return;
  if(!filterCat.has(m._p.c)){ filterCat.add(m._p.c); $(`#catChips [data-cat="${m._p.c}"]`).setAttribute('aria-pressed','true'); }
  if(filterCity!=='all' && filterCity!==m._p.city){ filterCity='all'; $$('#cityChips .chip').forEach(x=>x.setAttribute('aria-pressed', x.dataset.city==='all')); }
  applyFilters(false); map.flyTo(m.getLatLng(), 16, {duration:.8}); setTimeout(()=>m.openPopup(), 850);
}
let meMarker;
function locate(){
  if(!navigator.geolocation){ toast('Location is not available on this device'); return; }
  navigator.geolocation.getCurrentPosition(pos => {
    const ll=[pos.coords.latitude,pos.coords.longitude];
    if(meMarker) meMarker.setLatLng(ll); else meMarker = L.circleMarker(ll,{radius:9,color:'#fff',weight:3,fillColor:'#3e7cb1',fillOpacity:1}).addTo(map).bindPopup('You are here');
    map.flyTo(ll, 15);
  }, () => toast('Allow location access to see where you are'), {enableHighAccuracy:true, timeout:10000});
}
function xmlEsc(s){ return String(s).replace(/[<>&'"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;',"'":'&apos;','"':'&quot;'}[c])); }
function toKML(){
  const folders = Object.entries(CAT).map(([k,v]) => {
    const pts = D.places.filter(p=>p.c===k).map(p=>`<Placemark><name>${xmlEsc(p.n)}</name><description>${xmlEsc((p.note||'')+(p.src?' '+igURL(p.src):''))}</description><Point><coordinates>${p.lng},${p.lat},0</coordinates></Point></Placemark>`).join('');
    return `<Folder><name>${v.label}</name>${pts}</Folder>`;
  }).join('');
  return `<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Document><name>${xmlEsc(D.trip.title)}</name>${folders}</Document></kml>`;
}
function toGPX(){
  const w = D.places.map(p=>`<wpt lat="${p.lat}" lon="${p.lng}"><name>${xmlEsc(p.n)}</name><desc>${xmlEsc(p.note||'')}</desc><type>${CAT[p.c].label}</type></wpt>`).join('');
  return `<?xml version="1.0" encoding="UTF-8"?><gpx version="1.1" creator="Our trips" xmlns="http://www.topografix.com/GPX/1/1">${w}</gpx>`;
}
function download(name, text, type){
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type})); a.download=name; document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href); a.remove();},500);
  toast(name+' downloaded. Import it into Organic Maps or Google My Maps');
}
async function saveTiles(){
  if(!map) return;
  const b=map.getBounds(), z0=map.getZoom(), urls=[];
  const t = (lat,lng,z) => { const n=2**z; const x=Math.floor((lng+180)/360*n); const r=lat*Math.PI/180; const y=Math.floor((1-Math.log(Math.tan(r)+1/Math.cos(r))/Math.PI)/2*n); return [x,y]; };
  for(let z=z0; z<=Math.min(z0+2,17); z++){
    const [x0,y0]=t(b.getNorth(),b.getWest(),z), [x1,y1]=t(b.getSouth(),b.getEast(),z);
    for(let x=x0;x<=x1;x++) for(let y=y0;y<=y1;y++) urls.push(`https://tile.openstreetmap.org/${z}/${x}/${y}.png`);
  }
  if(urls.length>250){ toast('Zoom in a little more first (keeps the download small)'); return; }
  toast(`Saving ${urls.length} map tiles…`);
  let ok=0; for(const u of urls){ try{ const r=await fetch(u,{mode:'cors'}); if(r.ok) ok++; }catch(e){} }
  toast(`Saved ${ok} tiles. This area now works offline`);
}

let txMode='spend';
function saveW(){ LS.set('wallet', W); scheduleSync(); }
const fmtUSD = n => WL().carrySym + (Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:2});
const fmtVND = n => Math.round(n).toLocaleString('en-US') + ' ' + WL().localSym;
const fmtINR = n => WL().homeSym + Math.round(n).toLocaleString('en-IN');
function balances(){
  let usd=0, vnd=0, spentUSD=0; const byCat={};
  W.txns.forEach(t=>{
    if(t.type==='add') usd += t.usd;
    if(t.type==='exchange'){ usd -= t.usd; vnd += t.vnd; }
    if(t.type==='spend'){ const inUSD = t.cur===WL().carry ? t.amt : t.amt / W.rate.vnd; if(t.cur===WL().carry) usd -= t.amt; else vnd -= t.amt; spentUSD += inUSD; byCat[t.cat]=(byCat[t.cat]||0)+inUSD; }
  });
  return {usd, vnd, spentUSD, byCat, totalUSD: usd + vnd / W.rate.vnd};
}
async function fetchRate(){
  try{
    const r = await fetch('https://open.er-api.com/v6/latest/'+WL().carry, {cache:'no-store'});
    const j = await r.json();
    if(j && j.rates && j.rates[WL().local]){ W.rate = {vnd:j.rates[WL().local], inr:j.rates[WL().home], at:Date.now(), live:true}; saveW(); drawWallet(); }
  }catch(e){ /* offline: keep last saved rate */ }
}
function renderWallet(){

}

function wireTxForm(){
  const f=$('#txForm'); const num = s => parseFloat(String(s||'').replace(/,/g,''))||0;
  if(txMode==='exchange'){ const u=$('#fUSD'), v=$('#fVND'); const upd=()=>{ const a=num(u.value), c=num(v.value); $('#fRate').textContent = a&&c ? `Shop rate ${Math.round(c/a).toLocaleString('en-US')} ${WL().localSym} per ${WL().carry} (market ${Math.round(W.rate.vnd).toLocaleString('en-US')})` : 'Shop rate shows here as you type'; }; u.oninput=()=>{ if(!v.dataset.touched) v.value = num(u.value)? Math.round(num(u.value)*W.rate.vnd).toLocaleString('en-US'):''; upd(); }; v.oninput=()=>{ v.dataset.touched=1; upd(); }; }
  f.onsubmit = e => {
    e.preventDefault(); const id = Date.now().toString(36)+Math.random().toString(36).slice(2,6), ts=Date.now(), note=($('#fNote')||{}).value||'';
    if(txMode==='add'){ const usd=num($('#fUSD').value); if(!usd) return; W.txns.push({id,ts,type:'add',usd,note,date:todayISO()}); toast(`Added ${fmtUSD(usd)}`); }
    else if(txMode==='exchange'){ const usd=num($('#fUSD').value), vnd=num($('#fVND').value); if(!usd||!vnd) return; W.txns.push({id,ts,type:'exchange',usd,vnd,note,date:todayISO()}); toast(`Exchanged ${fmtUSD(usd)} for ${fmtVND(vnd)}`); }
    else { const amt=num($('#fAmt').value); if(!amt) return; W.txns.push({id,ts,type:'spend',amt,cur:$('#fCur').value,cat:$('#fCat').value,note,date:$('#fDate').value||todayISO()}); toast('Spend logged'); }
    saveW(); drawWallet();
  };
}
function txRow(t){

  else { label=t.cat; amt='−'+(t.cur===WL().carry?fmtUSD(t.amt):fmtVND(t.amt)); }
  return `<li><div><div>${esc(label)}${t.note?`<span class="muted">, ${esc(t.note)}</span>`:''}</div><div class="small muted">${fmtDate(t.date,{day:'numeric',month:'short'})}</div></div><div class="amt ${cls}">${amt}</div><button aria-label="Delete entry" data-id="${t.id}">${ICON.x.replace('<svg','<svg width="16" height="16" style="stroke:currentColor;fill:none;stroke-width:2"')}</button></li>`;

    <p class="small muted" style="margin:6px 0">${ins.certs.map(esc).join('<br>')}</p>
    <div class="call"><span>Emergency assistance</span><a href="tel:${ins.assist.replace(/\s/g,'')}">${esc(ins.assist)}</a></div>
    <div class="call"><span>Claims (India toll-free)</span><a href="tel:${ins.claims.replace(/\s/g,'')}">${esc(ins.claims)}</a></div>
  </div></div>

  <div class="block"><h3>Emergency numbers</h3><div class="panel">${D.docs.emergency.map(([k,n])=>`<div class="call"><span>${esc(k)}</span><a href="tel:${n.replace(/\s/g,'')}">${esc(n)}</a></div>`).join('')}</div></div>
  <div class="block"><h3>Appearance</h3><div class="seg" role="group" aria-label="Theme"><button data-th="auto">System</button><button data-th="light">Light</button><button data-th="dark">Dark</button></div></div>`;
  $$('#view-pack .check input').forEach(c=>c.addEventListener('change',()=>{ setMapEntry('pack', c.dataset.k, c.checked); const y=window.scrollY; renderPack(); window.scrollTo(0,y); }));
  const tsp=$('#toShopPlan'); if(tsp) tsp.onclick=()=>{ findTab='shop'; renderFinds(); };
  const th = LS.get('theme','auto');
  $$('[data-th]').forEach(b=>{ b.setAttribute('aria-pressed', b.dataset.th===th); b.onclick=()=>{ LS.set('theme',b.dataset.th); applyTheme(); renderPack(); }; });
}
function applyTheme(){ const th=LS.get('theme','auto'); if(th==='auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', th); }
applyTheme();
</script>
</body>
</html>
